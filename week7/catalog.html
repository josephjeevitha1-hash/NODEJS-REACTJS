<!DOCTYPE html>
<html>

<head>

    <title>Product Catalog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">
            Shopping Cart
        </div>

        <ul>
            <li><a href="catalog.html">Home</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>

    </nav>

</header>


<section class="catalog">

    <h2>Product Catalog</h2>

    <div class="product-grid">


        <div class="card">

            <img src="images/laptop.jpg">

            <h3>Laptop</h3>

            <p>₹50,000</p>

            <button onclick="addToCart('Laptop', 50000)">
                Add to Cart
            </button>

        </div>


        <div class="card">

            <img src="images/phone.jpg">

            <h3>Mobile</h3>

            <p>₹100,000</p>

            <button onclick="addToCart('Mobile', 100000)">
                Add to Cart
            </button>

        </div>


        <div class="card">

            <img src="images/headphone.jpg">

            <h3>Headphones</h3>

            <p>₹2,000</p>

            <button onclick="addToCart('Headphones', 2000)">
                Add to Cart
            </button>

        </div>


    </div>

</section>


<script src="catalog.js"></script>

</body>

</html>
