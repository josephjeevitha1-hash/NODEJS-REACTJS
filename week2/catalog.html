<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Catalog</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Your CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="#">Shopping Cart</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="catalog.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">Logout</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- Product Section -->
<div class="container py-5">

    <h2 class="text-center mb-4">Product Catalog</h2>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://via.placeholder.com/300x220?text=Laptop"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">

                    <h4 class="card-title">Laptop</h4>

                    <p class="text-success fw-bold">₹50,000</p>

                    <button class="btn btn-primary"
                            onclick="location.href='cart.html'">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 2 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://via.placeholder.com/300x220?text=Mobile"
                     class="card-img-top"
                     alt="Mobile">

                <div class="card-body text-center">

                    <h4 class="card-title">Mobile</h4>

                    <p class="text-success fw-bold">₹20,000</p>

                    <button class="btn btn-primary"
                            onclick="location.href='cart.html'">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

        <!-- Product 3 -->
        <div class="col-md-4">

            <div class="card h-100 shadow">

                <img src="https://via.placeholder.com/300x220?text=Headphones"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">

                    <h4 class="card-title">Headphones</h4>

                    <p class="text-success fw-bold">₹2,000</p>

                    <button class="btn btn-primary"
                            onclick="location.href='cart.html'">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
