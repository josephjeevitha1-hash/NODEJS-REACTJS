
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">


<!-- Navigation Bar -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="catalog.html">

            Shopping Cart

        </a>

        <div>

            <a href="catalog.html"
               class="btn btn-light me-2">

                Home

            </a>

            <a href="cart.html"
               class="btn btn-light me-2">

                Cart

            </a>

            <a href="login.html"
               class="btn btn-danger">

                Logout

            </a>

        </div>

    </div>

</nav>


<!-- Cart Section -->

<div class="container my-5">

    <h2 class="text-center mb-4">
        Shopping Cart
    </h2>


    <!-- Cart Table -->

    <div class="table-responsive">

        <table class="table table-bordered table-hover text-center bg-white">

            <thead class="table-primary">

                <tr>

                    <th>Product</th>

                    <th>Price</th>

                    <th>Quantity</th>

                    <th>Total</th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>Laptop</td>

                    <td>₹50,000</td>

                    <td>1</td>

                    <td>₹50,000</td>

                </tr>


                <tr>

                    <td>Mobile</td>

                    <td>₹20,000</td>

                    <td>1</td>

                    <td>₹20,000</td>

                </tr>


                <tr>

                    <td>Headphones</td>

                    <td>₹2,000</td>

                    <td>1</td>

                    <td>₹2,000</td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- Grand Total -->

    <div class="text-end">

        <h4>
            Grand Total : ₹72,000
        </h4>

    </div>


    <!-- Continue Shopping -->

    <div class="text-center mt-4">

        <a href="catalog.html"
           class="btn btn-primary">

            Continue Shopping

        </a>

    </div>

</div>


</body>

</html>
